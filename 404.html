<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Avanti Print &amp; Design</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Old WordPress addresses (Google has these indexed) land here once the new site
   replaces WordPress. Send each one to the matching page of the new site.
   Works on a custom domain and on a github.io project address. */
(function () {
  var p = location.pathname, base = '/';
  if (/\.github\.io$/.test(location.hostname)) { var first = p.split('/')[1]; if (first) { base = '/' + first + '/'; p = p.slice(base.length - 1); } }
  var seg = p.split('/').filter(Boolean).map(decodeURIComponent);
  var pages = { 'shop': '#/shop', 'blog': '#/blog', 'about-us': '#/about', 'contact-us': '#/contact', 'cart': '#/', 'my-account': '#/',
    'terms-and-conditions': '#/page/terms', 'privacy-policy': '#/page/privacy', 'returns-policy': '#/page/returns' };
  var alias = { banners: 'pull-up-banners' }, to = '#/';
  if (seg[0] === 'product-category' && seg[1]) to = '#/shop/' + (alias[seg[1]] || seg[1]);
  else if (seg[0] === 'product' && seg[1]) to = '#/product/' + seg[1];
  else if (seg[0] === 'blog' && seg[1] === 'page' && seg[2]) to = '#/blog?page=' + seg[2];
  else if (seg[0] === 'category' || seg[0] === 'author') to = '#/blog';
  else if (seg.length === 4 && /^\d{4}$/.test(seg[0]) && /^\d{2}$/.test(seg[1])) to = '#/blog/' + seg[3];   // old dated post address
  else if (seg.length && pages[seg[0]]) to = pages[seg[0]];
  else if (seg.length === 1 && /^[a-z0-9-]+$/.test(seg[0])) to = '#/blog/' + seg[0];   // old post address
  location.replace(base + to);
})();
</script>
</head>
<body><p><a href="/">Continue to Avanti Print &amp; Design</a></p></body>
</html>
